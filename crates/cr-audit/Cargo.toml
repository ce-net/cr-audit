[package]
name = "cr-audit"
version = "0.2.0"
description = "The cr.audit cell: the audit trail of every node and the keys audit as one live projection; majors 2 and 1"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cr-audit"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
cr-audit-api = { path = "../cr-audit-api" }
ui-part = { workspace = true }
ui-chain = { workspace = true }
cr-sources = { workspace = true }
ce-wire = { workspace = true, features = ["server", "client"] }
ce-gate = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
serde_json = "1"
