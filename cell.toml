# One repo = one cell = one function. The audit trail of every node for the Audit panel.
[cell]
api = "cr.audit"
crate = "cr-audit"
args = ["serve"]
kind = "function"

# Cells this one calls, as <api>@<major>; none is started by it (a view cell reports a missing source, it does not need it to start).
depends_on = []

[launch]
health = "HealthOp"
start_timeout_ms = 5000
restart_backoff_ms = [1000, 300000]

[placement]
# where it runs is the deploy's placement table (repo:control-room docs/DESIGN.md section 11), not this file

[limits]
disk_bytes = "128M"

[stamp]
id = "cell:cr.audit"
kind = "cell"
path = "cell.toml"
updated_at = 2026-11-15T22:05:56Z
version = "0.7"
access = "public"
canonical_of = []
duplicate_of = ""
owner = "foreman/lead"
source_of_truth = "https://github.com/ce-net/cr-audit"
stale_after = 180
